<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>応募フォーム｜和アートセラピー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="logo"><i></i>和アートセラピー</a>
    <ul><li><a href="index.html" class="btn ghost small" style="box-shadow:none">← トップへ</a></li></ul>
  </div>
</header>

<main>
  <section class="apply-hero">
    <div class="container">
      <span class="en">Apply</span>
      <h1>応募フォーム</h1>
      <p style="margin-top:14px">施設の方・学生の方、それぞれのフォームからお申し込みください。</p>
      <div class="tabs" role="tablist">
        <button class="tab active" data-target="facility" role="tab">施設の方</button>
        <button class="tab" data-target="student" role="tab">学生の方</button>
      </div>
    </div>
  </section>

  <div class="container">
    <div class="form-wrap">

      <!-- Facility -->
      <form class="panel active" id="facility">
        <div class="field"><label>施設名<small>必須</small></label><input type="text" name="facility_name" required></div>
        <div class="row2">
          <div class="field"><label>ご担当者名<small>必須</small></label><input type="text" name="contact_name" required></div>
          <div class="field"><label>役職</label><input type="text" name="role"></div>
        </div>
        <div class="row2">
          <div class="field"><label>メールアドレス<small>必須</small></label><input type="email" name="email" required></div>
          <div class="field"><label>電話番号</label><input type="tel" name="tel"></div>
        </div>
        <div class="field"><label>施設の所在地（市区町村）</label><input type="text" name="area"></div>
        <div class="row2">
          <div class="field"><label>施設の種類</label>
            <select name="type"><option>特別養護老人ホーム</option><option>介護老人保健施設</option><option>デイサービス</option><option>有料老人ホーム</option><option>その他</option></select>
          </div>
          <div class="field"><label>参加予定人数（目安）</label><input type="text" name="people" placeholder="例：10名"></div>
        </div>
        <div class="field"><label>ご希望の時期</label>
          <div class="checks">
            <label><input type="checkbox"> 平日午前</label><label><input type="checkbox"> 平日午後</label><label><input type="checkbox"> 土日</label>
          </div>
        </div>
        <div class="field"><label>ご質問・ご要望</label><textarea name="message"></textarea></div>
        <div class="field"><div class="checks"><label><input type="checkbox" required> 個人情報の取り扱いに同意します</label></div></div>
        <button class="btn" type="submit">施設として応募する</button>
        <div class="thanks"><h3>ありがとうございます。</h3><p>内容を確認のうえ、担当よりご連絡します。</p></div>
      </form>

      <!-- Student -->
      <form class="panel" id="student">
        <div class="row2">
          <div class="field"><label>お名前<small>必須</small></label><input type="text" name="name" required></div>
          <div class="field"><label>ふりがな</label><input type="text" name="kana"></div>
        </div>
        <div class="row2">
          <div class="field"><label>大学・学部<small>必須</small></label><input type="text" name="univ" required></div>
          <div class="field"><label>学年</label>
            <select name="grade"><option>1年</option><option>2年</option><option>3年</option><option>4年</option><option>大学院</option><option>その他</option></select>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>メールアドレス<small>必須</small></label><input type="email" name="email" required></div>
          <div class="field"><label>電話番号</label><input type="tel" name="tel"></div>
        </div>
        <div class="field"><label>関わり方（複数可）</label>
          <div class="checks">
            <label><input type="checkbox"> 施設訪問</label><label><input type="checkbox"> 企画・準備</label><label><input type="checkbox"> デザイン・制作</label><label><input type="checkbox"> 研究・記録</label><label><input type="checkbox"> 広報</label>
          </div>
        </div>
        <div class="field"><label>参加したい理由・自己紹介</label><textarea name="motive"></textarea></div>
        <div class="field"><div class="checks"><label><input type="checkbox" required> 個人情報の取り扱いに同意します</label></div></div>
        <button class="btn indigo" type="submit">学生として応募する</button>
        <div class="thanks"><h3>ありがとうございます。</h3><p>内容を確認のうえ、担当よりご連絡します。</p></div>
      </form>

      <p class="note">※ 現在は見た目のみのデモです。送信先（Googleフォーム／メール等）は後で接続してください。</p>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="logo"><i></i>和アートセラピー</div>
    <p>© 2026 Wa Art Therapy</p>
  </div>
</footer>

<script>
const tabs = document.querySelectorAll('.tab');
const panels = document.querySelectorAll('form.panel');
function show(id) {
  if (!document.getElementById(id)) id = 'facility';
  tabs.forEach(t => t.classList.toggle('active', t.dataset.target === id));
  panels.forEach(p => p.classList.toggle('active', p.id === id));
}
tabs.forEach(t => t.addEventListener('click', () => { show(t.dataset.target); history.replaceState(null, '', '#' + t.dataset.target); }));
show(location.hash.replace('#', ''));
window.addEventListener('hashchange', () => show(location.hash.replace('#', '')));

panels.forEach(p => p.addEventListener('submit', e => {
  e.preventDefault();
  p.querySelectorAll('.field, button[type=submit]').forEach(el => el.style.display = 'none');
  p.querySelector('.thanks').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}));
</script>
</body>
</html>
